<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termos de Uso - NEXO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111111;
            color: #E5E7EB;
        }
        .md h1 { font-size: 2rem; font-weight: 700; color: #fff; margin: 0 0 1rem; }
        .md h2 { font-size: 1.25rem; font-weight: 700; color: #fff; margin: 1.75rem 0 0.75rem; }
        .md h3 { font-size: 1.125rem; font-weight: 700; color: #fff; margin: 1.25rem 0 0.5rem; }
        .md p { color: #D1D5DB; line-height: 1.75; margin: 0.75rem 0; }
        .md ul, .md ol { color: #D1D5DB; line-height: 1.75; margin: 0.75rem 0 0.75rem 1.25rem; }
        .md li { margin: 0.25rem 0; }
        .md a { color: #C4B5FD; text-decoration: underline; text-underline-offset: 2px; }
        .md strong { color: #F3F4F6; }
        .md code { background: #0B0B0B; padding: 0.1rem 0.35rem; border-radius: 0.25rem; }
        .md pre { background: #0B0B0B; padding: 1rem; border-radius: 0.5rem; overflow: auto; margin: 1rem 0; }
        .md pre code { background: transparent; padding: 0; }
        .md hr { border-color: #262626; margin: 1.5rem 0; }
        .md blockquote { border-left: 4px solid #262626; padding-left: 1rem; color: #D1D5DB; margin: 1rem 0; }
    </style>
</head>
<body class="antialiased">
    <div class="container mx-auto px-6 py-12">
        <header class="text-center mb-10">
            <a href="index.html" class="inline-block text-gray-400 hover:text-white transition-colors">← Voltar ao início</a>
            <h1 class="text-4xl font-bold text-white mt-6">NEXO</h1>
            <p class="text-gray-400 mt-2">Termos de Uso</p>
        </header>

        <main class="max-w-3xl mx-auto">
            <section class="bg-neutral-800 p-8 rounded-lg shadow-lg">
                <div id="content" class="md">
                    <p>Carregando conteúdo…</p>
                </div>
                <p id="loadError" class="hidden mt-4 text-sm text-red-300"></p>
            </section>
        </main>

        <footer class="text-center mt-16 text-gray-500">
            <p>&copy; 2024 NEXO. Todos os direitos reservados.</p>
            <p class="mt-2">
                <a class="hover:text-gray-300" href="termos-de-uso.html">Termos de Uso</a>
                <span class="mx-2">•</span>
                <a class="hover:text-gray-300" href="politica-de-privacidade.html">Política de Privacidade</a>
                <span class="mx-2">•</span>
                <a class="hover:text-gray-300" href="exclusao-de-dados.html">Exclusão de Dados</a>
            </p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script>
        (async () => {
            const contentEl = document.getElementById('content');
            const errorEl = document.getElementById('loadError');

            try {
                const response = await fetch('termos-de-uso.md', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Não foi possível carregar o arquivo termos-de-uso.md');
                }

                const md = await response.text();
                contentEl.innerHTML = marked.parse(md);
            } catch (error) {
                contentEl.innerHTML = '';
                errorEl.textContent = String(error && error.message ? error.message : error);
                errorEl.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
